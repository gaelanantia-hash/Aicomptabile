name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Desktop app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ledgerflow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ledgerflow/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build:desktop

  licensing:
    name: Licensing service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/licensing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/licensing/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
