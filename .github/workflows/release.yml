name: Release

# Publishing a version: raise the version in apps/ledgerflow/package.json, update apps/licensing/releases.json,
# then push the matching tag (v0.2.0 for version 0.2.0). Without GitHub, scripts/publish-release.ps1 does the same from a PC.
# Required repository configuration is listed in docs/06-rilascio.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/ledgerflow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ledgerflow/package-lock.json
      - name: Tag matches the app version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - name: Write desktop.config.json
        shell: bash
        run: |
          cat > desktop.config.json <<EOF
          {
            "googleClientId": "${{ vars.GOOGLE_OAUTH_CLIENT_ID }}",
            "googleClientSecret": "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}",
            "licenseServerUrl": "${{ vars.LICENSE_SERVER_URL }}",
            "licensePublicKey": "${{ vars.LICENSE_PUBLIC_KEY }}",
            "updateFeedUrl": "https://storage.googleapis.com/${{ vars.RELEASE_BUCKET }}/releases",
            "trialUntil": "${{ vars.TRIAL_UNTIL }}"
          }
          EOF
      - name: Build and sign
        run: npm run dist
        env:
          # Code-signing certificate (.pfx as base64) and its password. Optional: without them the installer is unsigned.
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # Stored as is (gzip: false): a gzip-stored object ignores byte ranges, which the app's partial (blockmap) updates rely on.
      - name: Publish installer
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: apps/ledgerflow/release
          destination: ${{ vars.RELEASE_BUCKET }}/releases
          parent: false
          glob: '*.{exe,blockmap}'
          gzip: false
          process_gcloudignore: false
      # Last, and never cached: installed apps poll this file and must only see a version whose files are all in place.
      - name: Publish update feed
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: apps/ledgerflow/release/latest.yml
          destination: ${{ vars.RELEASE_BUCKET }}/releases
          gzip: false
          process_gcloudignore: false
          headers: |-
            cache-control: no-cache

  licensing:
    name: Deploy licensing service
    needs: installer
    # Trial builds run without the licensing service.
    if: vars.LICENSE_SERVER_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci && npm test
        working-directory: apps/licensing
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: aicom-licensing
          region: ${{ vars.GCP_REGION }}
          source: apps/licensing
          secrets: |
            LICENSE_PRIVATE_KEY=aicom-license-private-key:latest
            ADMIN_TOKEN=aicom-admin-token:latest
